steps:
  - name: Checkout Repository
    uses: actions/checkout@v4
    
  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: '18'
      cache: 'npm'
      
  # If your project has dependencies, install them
  - name: Install Dependencies
    run: |
      if [ -f package.json ]; then
        npm ci
      fi
      
  # If your project needs building (React, Vue, etc.)
  - name: Build Project
    run: |
      if [ -f package.json ] && npm run build --if-present; then
        echo "Build completed"
      else
        echo "No build step required"
      fi
      
  - name: Configure AWS Credentials
    uses: aws-actions/configure-aws-credentials@v4
    with:
      aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      aws-region: us-east-1
      
  - name: Sync Website to S3
    run: |
      # Determine source directory (adjust based on your project structure)
      if [ -d "build" ]; then
        SOURCE_DIR="build"
      elif [ -d "dist" ]; then
        SOURCE_DIR="dist"
      elif [ -d "public" ]; then
        SOURCE_DIR="public"
      else
        SOURCE_DIR="."
      fi
      
      echo "Syncing from $SOURCE_DIR to S3..."
      aws s3 sync $SOURCE_DIR s3://${{ secrets.WEBSITE_BUCKET_NAME }} --delete --exclude ".git/*" --exclude ".github/*" --exclude "node_modules/*" --exclude "*.md"
      
  - name: Invalidate CloudFront Cache
    run: |
      aws cloudfront create-invalidation --distribution-id ${{ secrets.DISTRIBUTION_ID }} --paths "/*"
      
  - name: Deployment Status
    run: |
      echo "✅ Deployment completed successfully!"
      echo "🌐 Your website should be available at your CloudFront domain"